[build-system]
requires = ["setuptools>=68,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "edmg-studio-backend"
version = "1.2.0"
description = "Backend API for EDMG Studio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.24",
  "pydantic>=2.5",
  "requests>=2.31",
  "python-multipart>=0.0.9",
  "py7zr>=0.21.0",
  "Pillow>=10.0.0",
  "huggingface-hub>=0.34.0,<1.0",
  "hf-transfer==0.1.9",
  "hf-xet==1.5.1",
  "keyring>=24.3.0",
]

[project.optional-dependencies]
cpu = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchaudio==2.11.0",
]
directml = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchaudio==2.11.0",
  "onnxruntime-directml>=1.18.0,<2; sys_platform == 'win32'",
  "optimum>=2,<3; sys_platform == 'win32'",
  "optimum-onnx>=0.1,<1; sys_platform == 'win32'",
]
cuda = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchaudio==2.11.0",
  "torch-tensorrt==2.11.0",
  "cuda-python==13.0.3",
  "tensorrt==10.15.1.29",
  "tensorrt-cu13==10.15.1.29",
  "tensorrt-cu13-bindings==10.15.1.29",
  "tensorrt-cu13-libs==10.15.1.29",
]
core = [
  "numpy>=1.26,<2",
  "scipy>=1.10,<2",
  "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
  "spacy>=3.5,<4",
  "textblob>=0.17,<1",
  "nltk>=3.8,<4",
  "tzdata>=2024.1",
  "python-dotenv>=0.21,<2",
  "tbb>=2021; sys_platform == 'win32'",
]
audio = [
  "librosa>=0.10.2,<1",
  "soundfile>=0.12,<1",
]
clap = ["transformers>=4.42,<5"]
asr = [
  "faster-whisper>=1.1,<2",
  "openai-whisper>=20240930",
]
source-separation = ["demucs>=4.0.1,<5"]
parakeet = ["nemo-toolkit[asr]>=2.6.2,<3"]
aws = ["boto3>=1.34,<2"]
azure = [
  "azure-storage-blob>=12.20,<13",
  "azure-identity>=1.16,<2",
]
codex = ["openai-codex"]
internal-video = [
  "diffusers>=0.30,<1",
  "transformers>=4.42,<5",
  "sentencepiece>=0.2,<1",
  "accelerate>=0.33,<2",
  "safetensors>=0.4.3,<1",
  "tensorboard>=2.16,<3",
]
advanced = [
  "aiohttp>=3.10,<4",
  "opencv-python-headless>=4.10,<5",
  "psutil>=5.9,<8",
]
gradio = ["gradio>=5,<7"]
background-removal = ["rembg>=2,<3"]

[dependency-groups]
test = [
  "pytest>=9.0.3,<10",
  "httpx>=0.27,<1",
]
lint = ["ruff>=0.8,<1"]
build = [
  "build>=1.2,<2",
  "pyinstaller>=6.11,<7",
  "pycparser>=2.22,<3",
  "wheel>=0.45,<1",
  "setuptools>=68,<82",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
]

[tool.uv]
required-version = "==0.11.28"
default-groups = []
conflicts = [
  [{ extra = "cpu" }, { extra = "directml" }],
  [{ extra = "cpu" }, { extra = "cuda" }],
  [{ extra = "directml" }, { extra = "cuda" }],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cpu", extra = "directml" },
  { index = "pytorch-cu130", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cpu", extra = "directml" },
  { index = "pytorch-cu130", extra = "cuda" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cpu", extra = "directml" },
  { index = "pytorch-cu130", extra = "cuda" },
]
torch-tensorrt = [{ index = "pytorch-cu130", extra = "cuda" }]
tensorrt = [{ index = "nvidia", extra = "cuda" }]
tensorrt-cu13 = [{ index = "nvidia", extra = "cuda" }]
tensorrt-cu13-bindings = [{ index = "nvidia", extra = "cuda" }]
tensorrt-cu13-libs = [{ index = "nvidia", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[project.scripts]
edmg-studio-backend = "edmg_studio_backend.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = [
  "edmg_studio_backend*",
  "enhanced_deforum_music_generator*",
  "deforum_music*",
  "edmg_ai_service*",
  "edmg*",
]

[tool.setuptools.package-data]
edmg_studio_backend = ["services/engine_package_manifests.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  "build",
  "dist",
  "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]

[tool.ruff.lint.isort]
known-first-party = [
  "deforum_music",
  "edmg",
  "edmg_ai_service",
  "edmg_studio_backend",
  "enhanced_deforum_music_generator",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
  "enhanced_deforum_music_generator/tests",
  "edmg_studio_backend/tests",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# CUDA DLL search paths must be prepared before imports that can load native
# Torch/TensorRT modules. Keep this bootstrap ordering explicit and narrow.
"edmg_studio_backend/app.py" = ["E402"]
"edmg_studio_backend/cli.py" = ["E402"]
